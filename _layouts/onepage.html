<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.author.name | default: site.name }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <div class="top-nav">
    <div class="nav-container">
      <div class="nav-section">
        <h3>Menu</h3>
        <ul>
          <li><a href="{{ '/' | relative_url }}">🏠 Home</a></li>
          <li><a href="{{ '/' | relative_url }}#news">📰 News</a></li>
          <li><a href="{{ '/' | relative_url }}#curriculum">🎓 Curriculum</a></li>
          <li><a href="{{ '/publications/' | relative_url }}">📖 Publications</a></li>
          <li><a href="{{ '/' | relative_url }}#teaching">🏫 Teaching</a></li>
        </ul>
      </div>
      <div class="nav-section">
        <h3>Links</h3>
        <ul>
          {% for l in site.data.links %}
            <li><a href="{{ l.url }}" target="_blank" rel="noopener noreferrer">{{ l.name }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>

  <div class="container">
    <main class="main">
      {{ content }}
    </main>
    <footer class="footer">
      © {{ site.time | date: '%Y' }} {{ site.author.name }} · Last updated {{ site.time | date: '%B %Y' }}
    </footer>
  </div>
</body>
</html>
