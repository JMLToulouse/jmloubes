name: Build publication list

# Regenerates _data/publications.json whenever a BibTeX file in _bibliography/
# (or the theme list, or the build script) changes, then commits the result.
on:
  push:
    paths:
      - '_bibliography/**'
      - '_data/research_themes.yml'
      - 'scripts/build_publications.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # This workflow pushes to the repository

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build _data/publications.json
      run: python3 scripts/build_publications.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add _data/publications.json
        git commit -m "Automated update of publication list" || echo "No changes to commit"
        git push
